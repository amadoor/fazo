[package]
name = "fazo"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
description = "A stackless, JIT-capable, embeddable runtime for Lua 5.5.1"
repository = "https://github.com/amadoor/fazo"
readme = "../../README.md"
keywords = ["lua", "interpreter", "jit", "scripting", "vm"]
categories = ["compilers", "game-development"]
exclude = ["scoreboard.json"]


[dependencies]
hashbrown = "0.17"
libm = { version = "0.2.16", optional = true, default-features = false }
memchr = "2.8"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1.16", features = ["serde", "union"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cranelift-codegen = { version = "0.137.0", optional = true }
cranelift-frontend = { version = "0.137.0", optional = true }
cranelift-jit = { version = "0.137.0", optional = true }
cranelift-module = { version = "0.137.0", optional = true }
cranelift-native = { version = "0.137.0", optional = true }
target-lexicon = { version = "0.13.5", optional = true }
wasmtime-jit-icache-coherence = { package = "wasmtime-internal-jit-icache-coherence", version = "=50.0.0", optional = true }
asmkit-rs = { version = "0.7.5", default-features = false, features = ["x86", "aarch64"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory"], optional = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
yaxpeax-arm = "0.5"
yaxpeax-arch = "0.3"

[features]
default = ["jit"]
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:target-lexicon",
    "dep:wasmtime-jit-icache-coherence",
    "dep:asmkit-rs",
    "dep:libc",
    "dep:windows-sys",
]
libm = ["dep:libm"]
opcode-counts = []
gc-stress = []

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
too_many_arguments = "deny"
